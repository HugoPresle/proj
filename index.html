<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Franck le Cuisto 🍳</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="setup-screen" class="screen hidden">
    <div class="setup-card">
      <div class="setup-logo">🍳</div>
      <h1>Franck le Cuisto</h1>
      <p>Ton assistant repas perso. On planifie la semaine ensemble.</p>
      <button id="start-btn" class="btn-primary">Planifier ma semaine →</button>
    </div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <div class="chat-header">
      <span class="chat-logo">🍳</span>
      <span class="chat-title">Franck le Cuisto</span>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-wrap">
      <input type="text" id="chat-input" placeholder="Ta réponse..." autocomplete="off" />
      <button id="chat-send" class="btn-send">↑</button>
    </div>
  </div>

  <div id="planning-screen" class="screen hidden">
    <header class="app-header">
      <div class="header-left">
        <span class="header-logo">🍳</span>
        <div>
          <h1 class="header-title">Franck le Cuisto</h1>
          <span id="week-label" class="header-week"></span>
        </div>
      </div>
      <button id="new-week-btn" class="btn-outline">Nouvelle semaine</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="planning">Planning</button>
      <button class="tab" data-tab="courses">Courses</button>
    </nav>

    <main class="app-main">
      <section id="tab-planning" class="tab-content active">
        <div id="days-grid" class="days-grid"></div>
      </section>
      <section id="tab-courses" class="tab-content">
        <div id="courses-content" class="courses-content"></div>
        <button id="copy-courses-btn" class="btn-copy">📋 Copier la liste</button>
      </section>
    </main>

    <div id="recipe-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <button id="modal-close" class="modal-close">✕</button>
        <div id="modal-content"></div>
      </div>
    </div>
  </div>

  <div id="loading-screen" class="screen hidden">
    <div class="loading-wrap">
      <div class="loading-spinner"></div>
      <p id="loading-text">Franck prépare ta semaine...</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
